name: Mise à jour des magasins Alpy

on:
  schedule:
    - cron: "17 5 * * 1"   # chaque lundi vers 6 h / 7 h (heure de Paris)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation : affiche le résumé sans rien modifier"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-shops
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests du script
        run: python3 -m unittest scripts.test_update_shops

      - name: Simulation (aucun fichier modifié)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: python3 scripts/update_shops.py --dry-run

      - name: Mise à jour de shops.json
        if: github.event_name == 'schedule' || !inputs.dry_run
        run: python3 scripts/update_shops.py

      - name: Commit si le fichier a changé
        id: commit
        if: github.event_name == 'schedule' || !inputs.dry_run
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Aucun changement."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shops.json stations-towns.json
          git commit -m "Mise à jour automatique des magasins Alpy"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Vider le cache jsDelivr
        if: steps.commit.outputs.changed == 'true'
        run: curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/shops.json"
